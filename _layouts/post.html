<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="/static/css/blog.css">
</head>
<body>
  <div class="wrap">
    <nav class="site-nav">
      <a href="/posts/">&larr; All posts</a>
    </nav>
    <main>
      <article>
        <h1>{{ page.title }}</h1>
        <p class="meta">{{ page.date | date: "%B %-d, %Y" }}</p>
        {{ content }}
      </article>
    </main>
    <footer class="site-footer">&copy; {{ site.time | date: "%Y" }} {{ site.title | default: "thaoshibe" }}</footer>
  </div>
</body>
</html>

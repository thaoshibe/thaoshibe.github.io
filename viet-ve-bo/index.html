<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>viết về Bơ</title>
<meta property="og:title" content="viết về Bơ" />
<meta property="og:description" content="Những câu chuyện về Bơ, Mắm, và chuyện nuôi chó mèo." />
<meta property="og:image" content="./bo-di-my/our_journey_to_us.png" />
<link rel="icon" type="image/png" href="../images/bo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme.css" />
<style>
  .landing-head {
    padding: clamp(42px, 6vw, 72px) 24px clamp(28px, 4vw, 42px);
    text-align: center;
  }
  .landing-brand {
    color: var(--ink);
    font-family: var(--serif);
    font-size: clamp(2.35rem, 4vw, 3.35rem);
    font-weight: 500;
    letter-spacing: -.035em;
    line-height: 1;
    text-decoration: none;
  }
  .landing-note {
    color: var(--ink-4);
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .18em;
    margin-top: 12px;
    text-transform: uppercase;
  }

  .story-stage {
    margin: 0 auto;
    max-width: 1280px;
    overflow: visible;
    padding: 0 28px clamp(80px, 11vw, 140px);
  }
  .post-list {
    margin: 0 auto;
    max-width: 600px;
  }
  .post-row {
    color: inherit;
    display: block;
    padding: 9px 0 10px;
    position: relative;
    text-align: left;
    text-decoration: none;
  }
  .post-row.soon { cursor: default; }
  .row-title {
    font-family: var(--serif);
    font-size: clamp(1.08rem, 1.8vw, 1.28rem);
    font-weight: 500;
    letter-spacing: -.018em;
    line-height: 1.25;
    transition: color .18s ease;
  }
  .post-row:not(.soon):hover .row-title { color: var(--accent); }
  .post-row.soon .row-title { color: var(--ink-2); }
  .row-summary {
    color: var(--ink-3);
    font-size: 13px;
    line-height: 1.35;
    margin: 2px 0 0;
    max-width: 580px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .side-memory {
    --memory-rotate: -2deg;
    --memory-shift: 0px;
    border: 8px solid rgba(255, 254, 249, .96);
    border-bottom-width: 22px;
    box-shadow: 0 14px 38px rgba(50, 66, 38, .14);
    height: auto;
    pointer-events: none;
    position: absolute;
    top: calc(50% + var(--memory-shift));
    transform: translateY(-50%) rotate(var(--memory-rotate));
    width: 158px;
    z-index: 1;
  }
  .side-memory img {
    display: block;
    height: auto;
    width: 100%;
  }
  .memory-left { right: calc(100% + clamp(64px, 8vw, 128px)); }
  .memory-right { left: calc(100% + clamp(64px, 8vw, 128px)); }
  .memory-1 { --memory-rotate: -3.5deg; --memory-shift: -12px; width: 166px; }
  .memory-2 { --memory-rotate: 2.7deg; --memory-shift: 10px; width: 126px; }
  .memory-3 { --memory-rotate: -1.4deg; --memory-shift: 4px; width: 172px; }
  .memory-4 { --memory-rotate: 4deg; --memory-shift: -9px; width: 148px; }

  @media (max-width: 1040px) {
    .memory-left { right: calc(100% + 38px); }
    .memory-right { left: calc(100% + 38px); }
    .side-memory { opacity: .82; }
  }
  @media (max-width: 980px) {
    .story-stage { max-width: 650px; overflow: visible; padding-inline: 22px; }
    .side-memory { display: none; }
  }
  @media (max-width: 520px) {
    .landing-head { padding-bottom: 26px; }
    .story-stage { padding-inline: 20px; }
    .post-row { padding-block: 9px; }
    .row-summary {
      font-size: 12.5px;
      white-space: normal;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .row-title { transition: none; }
  }
</style>
</head>
<body class="landing-page">

  <div class="bg-layer"></div>

  <header class="landing-head">
    <a class="landing-brand" id="brand" href="./index.html">viết về Bơ</a>
    <p class="landing-note">những câu chuyện của hai chị em</p>
  </header>

  <main class="story-stage">
    <section class="post-list" id="post-list" aria-label="Những câu chuyện về Bơ">
      <p class="post-status">đang tải…</p>
    </section>
  </main>

  <footer class="foot">Copyright © 2026 <a href="../index.html">Thảo Shibe</a></footer>

<script>
function esc(value){
  return String(value == null ? '' : value).replace(/[&<>"']/g,function(char){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];
  });
}

fetch('./posts.json?_=' + Date.now()).then(function(response){
  if(!response.ok) throw new Error('Không tải được danh sách bài viết');
  return response.json();
}).then(function(data){
  var site = data.site || {};
  var posts = data.posts || [];
  var list = document.getElementById('post-list');
  var imageIndex = 0;

  if(site.brand){
    document.title = site.brand;
    document.getElementById('brand').textContent = site.brand;
  }

  if(!posts.length){
    list.innerHTML = '<p class="post-status">album vẫn đang chờ câu chuyện đầu tiên.</p>';
    return;
  }

  list.innerHTML = posts.map(function(post){
    var soon = post.status !== 'live';
    var tag = soon ? 'div' : 'a';
    var href = post.url || ('./post.html?post=' + encodeURIComponent(post.slug));
    var attrs = soon ? '' : ' href="' + esc(href) + '"';
    var picture = '';

    if(post.cover){
      var side = imageIndex % 2 === 0 ? 'memory-left' : 'memory-right';
      var variation = 'memory-' + ((imageIndex % 4) + 1);
      picture = '<figure class="side-memory ' + side + ' ' + variation + '" aria-hidden="true">' +
        '<img src="' + esc(post.cover) + '" alt="" loading="lazy" />' +
      '</figure>';
      imageIndex += 1;
    }

    return '<' + tag + ' class="post-row' + (soon ? ' soon' : '') + '"' + attrs + '>' +
      '<div class="row-title">' + esc(post.title) + '</div>' +
      (post.excerpt ? '<div class="row-summary">' + esc(post.excerpt) + '</div>' : '') +
      picture +
    '</' + tag + '>';
  }).join('');
}).catch(function(error){
  document.getElementById('post-list').innerHTML =
    '<p class="post-status">Không mở được album — hãy thử lại một chút nha.</p>';
  console.error(error);
});
</script>
</body>
</html>

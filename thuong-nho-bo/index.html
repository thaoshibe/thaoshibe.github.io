<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bơ và chị Thảo</title>
<meta property="og:title" content="Bơ và chị Thảo" />
<meta property="og:description" content="Những câu chuyện về Bơ, Mắm, và chuyện nuôi chó mèo." />
<meta property="og:image" content="./bo-di-my/our_journey_to_us.png" />
<link rel="icon" type="image/png" href="../images/bo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f0e5;
  --paper-light:#fbf8f0;
  --ink:#463d34;
  --ink-soft:#897d70;
  --line:#b4a99c;
  --green:#78836c;
  --serif:"Crimson Pro",Georgia,serif;
  --sans:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
  --write:"Caveat","Segoe Print","Bradley Hand",cursive;
}

*,*::before,*::after{box-sizing:border-box}
html{min-height:100%;background:var(--paper)}
body{
  min-height:100dvh;margin:0;color:var(--ink);font-family:var(--sans);
  background:
    linear-gradient(rgba(245,240,229,.2),rgba(245,240,229,.2)),
    url('./images/gpt-image-1.png') center/cover fixed no-repeat,
    var(--paper);
  -webkit-font-smoothing:antialiased;
}
body::after{
  content:"";position:fixed;inset:0;z-index:10;pointer-events:none;opacity:.038;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
  mix-blend-mode:multiply;
}

.page{
  width:min(540px,calc(72dvh - 45px),92vw);margin:0 auto;
  padding:clamp(14px,2vh,20px) clamp(10px,1.5vw,14px) 8px;
}
.masthead{margin:0 auto clamp(11px,1.7vh,16px);text-align:center}
.brand{
  display:inline-block;margin:0;color:var(--ink);font-family:var(--serif);
  font-size:clamp(28px,3.4vw,38px);font-style:italic;font-weight:400;
  line-height:1;letter-spacing:-.035em;
}
.brand::after{
  content:"";display:block;width:28px;height:1px;margin:8px auto 0;
  background:var(--green);opacity:.75;transform:rotate(-2deg);
}

.post-board{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:clamp(8px,1.2vh,11px) clamp(7px,1vw,9px);
  width:100%;margin:0 auto;
}
.loading-note,.empty-note{
  grid-column:1/-1;margin:0;text-align:center;color:var(--ink-soft);
  font-family:var(--serif);font-size:20px;font-style:italic;
}
.post-card{
  display:flex;flex-direction:column;min-width:0;padding:9px 9px 8px;color:inherit;
  text-decoration:none;background:#f9f6ed;border:1px solid rgba(108,92,75,.16);
  border-radius:1px;
  box-shadow:0 2px 2px rgba(74,58,43,.1),0 7px 14px rgba(74,58,43,.1);
}
.post-card:nth-child(3n+1){transform:rotate(-.35deg)}
.post-card:nth-child(3n){transform:rotate(.35deg)}
.card-picture{
  position:relative;display:block;aspect-ratio:1;overflow:hidden;
  background:var(--paper-light);border:1px solid rgba(83,68,53,.15);
  border-radius:0;
  box-shadow:inset 0 1px 4px rgba(66,49,36,.13);
}
.card-picture::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  border:0;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
}
.post-card:nth-child(6n+1){--tone:#778b86;--wash:#dfe8e3}
.post-card:nth-child(6n+2){--tone:#99866c;--wash:#e9decb}
.post-card:nth-child(6n+3){--tone:#8b766f;--wash:#eadbd5}
.post-card:nth-child(6n+4){--tone:#75806b;--wash:#dfe3d5}
.post-card:nth-child(6n+5){--tone:#a17c62;--wash:#ead7c8}
.post-card:nth-child(6n){--tone:#777f93;--wash:#dce0e8}

.placeholder{
  display:grid;place-items:center;
  background:
    radial-gradient(circle at 25% 22%,rgba(255,255,255,.7) 0 1px,transparent 2px),
    radial-gradient(circle at 78% 72%,rgba(255,255,255,.52) 0 1.5px,transparent 2.5px),
    linear-gradient(145deg,color-mix(in srgb,var(--wash) 76%,white),var(--wash));
}
.placeholder::before{
  content:attr(data-mark);display:grid;place-items:center;width:42%;aspect-ratio:1;
  color:color-mix(in srgb,var(--tone) 78%,var(--ink));font-family:var(--serif);
  font-size:clamp(38px,5vw,62px);font-style:italic;font-weight:400;
  border:1px solid color-mix(in srgb,var(--tone) 52%,transparent);
  border-radius:50%;opacity:.76;transform:rotate(-3deg);
}
.placeholder[data-mark="✿"]::before{border:0;font-size:clamp(48px,6vw,72px)}
.placeholder[data-mark="♡"]::before{border:0;font-size:clamp(54px,6.5vw,80px)}

.card-caption{
  display:grid;place-items:center;min-height:39px;padding:3px 3px 0;text-align:center;
}
.caption-copy{display:block;min-width:0;width:100%}
.title{
  display:-webkit-box;margin:0;overflow:hidden;color:#403a34;font-family:var(--write);
  font-size:clamp(15px,1.75vw,19px);font-weight:600;line-height:.92;
  -webkit-box-orient:vertical;-webkit-line-clamp:2;
}

.site-footer{
  margin:clamp(8px,1.2vh,12px) auto 0;text-align:center;color:var(--ink-soft);
  font-family:var(--serif);font-size:11px;font-style:italic;
}

@media (max-width:680px){
  body{background-position:43% center}
  .page{width:min(92vw,calc(70dvh - 20px));padding:10px 5px 6px}
  .masthead{margin-bottom:10px}
  .brand{font-size:29px}
  .post-board{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px 5px}
  .post-card{padding:6px 6px 5px}
  .card-caption{min-height:28px;padding:2px 1px 0}
  .title{font-size:11px;line-height:.94}
  .site-footer{margin-top:7px;font-size:9px}
}
@media (max-width:360px){
  .post-board{column-gap:4px}
  .title{font-size:10px}
}
@media (max-height:700px){
  .page{width:min(460px,calc(68dvh - 10px),92vw);padding-top:7px}
  .masthead{margin-bottom:7px}
  .brand{font-size:27px}
  .brand::after{margin-top:5px}
  .post-board{row-gap:6px}
  .card-caption{min-height:27px}
  .site-footer{margin-top:5px}
}
</style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <h1 class="brand">Bơ và chị Thảo</h1>
    </header>

    <section class="post-board" id="post-board" aria-label="Những câu chuyện về Bơ">
      <p class="loading-note">đang mở album…</p>
    </section>

    <footer class="site-footer">© 2026 chị Thảo</footer>
  </main>

<script>
function esc(value){
  return String(value == null ? '' : value).replace(/[&<>"']/g,function(char){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];
  });
}

fetch('./posts.json').then(function(response){
  if(!response.ok) throw new Error('Không tải được danh sách bài viết');
  return response.json();
}).then(function(data){
  var site = data.site || {};
  var posts = (data.posts || []).slice();
  var board = document.getElementById('post-board');
  var marks = ['✿','01','♡','04','05','06','07','08','09'];

  if(site.brand){
    document.title = site.brand;
    document.querySelector('.brand').textContent = site.brand;
  }

  if(posts.length === 8){
    posts.push({
      slug:'mot-cau-chuyen-nua',
      status:'soon',
      title:'một câu chuyện nữa…',
      dateLabel:'đang chờ được kể'
    });
  }

  var cards = posts.slice(0,9).map(function(post,index){
    var picture = '<span class="card-picture placeholder" data-mark="' +
      esc(marks[index] || String(index + 1).padStart(2,'0')) + '" aria-hidden="true"></span>';
    var caption = '<span class="card-caption"><span class="caption-copy">' +
      '<span class="title">' + esc(post.title) + '</span></span></span>';

    return '<article class="post-card is-placeholder" aria-label="' +
      esc(post.title) + '">' + picture + caption + '</article>';
  }).join('');

  board.innerHTML = cards || '<p class="empty-note">album vẫn đang chờ câu chuyện đầu tiên.</p>';
}).catch(function(error){
  document.getElementById('post-board').innerHTML =
    '<p class="empty-note">Không mở được album — hãy thử lại một chút nha.</p>';
  console.error(error);
});
</script>
</body>
</html>

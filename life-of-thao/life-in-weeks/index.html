<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A life in weeks, by Thao." />
  <meta name="theme-color" content="#f6f1e8" />
  <meta property="og:title" content="life-of-thao, in weeks" />
  <meta property="og:description" content="Small squares, big memories." />
  <title>life-of-thao, in weeks</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%200%20100%20100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bitcount+Grid+Double&display=swap" rel="stylesheet" />
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="../theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Crayon texture for the life-phase lines: rough wobbly edges + grain. -->
  <svg class="crayon-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="crayon" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="edgeNoise" />
      <feDisplacementMap in="SourceGraphic" in2="edgeNoise" scale="1.8" xChannelSelector="R" yChannelSelector="G" result="rough" />
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="4" result="grain" />
      <feComponentTransfer in="grain" result="grainAlpha">
        <feFuncA type="linear" slope="0.55" intercept="0" />
      </feComponentTransfer>
      <feComposite in="rough" in2="grainAlpha" operator="arithmetic" k1="0" k2="1" k3="-0.4" k4="0" />
    </filter>
  </svg>
  <header class="site-header">
    <button class="theme-toggle" id="theme-toggle" type="button">Theme</button>
    <nav aria-label="Main navigation">
      <a href="../">life-of-thao</a> / life-in-weeks
    </nav>
    <h1>life-in-weeks</h1>
    <p id="intro-copy">My life, where each week is a little square. Memories are written into the weeks when they happened.</p>
    <p class="preview-note" id="preview-note" hidden>
      Preview data — add your birthday and memories in <code>life-data.js</code>.
    </p>
  </header>

  <main id="timeline">
    <div class="view-switch" aria-label="Timeline view">
      <button type="button" class="active" data-view="weeks" aria-pressed="true">Weeks</button>
      <button type="button" data-view="list" aria-pressed="false">List</button>
      <button type="button" data-view="images" aria-pressed="false">Images</button>
      <button type="button" data-action="jump-now">Jump to Now</button>
    </div>
    <div class="duration-legend" id="duration-legend" aria-label="Life durations"></div>
    <div class="timeline" id="life-grid" aria-live="polite"></div>
    <div class="memory-list-view" id="memory-list" aria-live="polite" hidden></div>
    <div class="memory-image-view" id="memory-images" aria-live="polite" hidden></div>
  </main>

  <footer>
    <p>Copyright © 2026 <a href="https://thaoshibe.github.io/">thaoshibe</a>. Background images [<a href="https://unsplash.com/photos/nimbus-clouds-and-blue-calm-sky-9BJRGlqoIUk" target="_blank" rel="noopener">Day</a>, <a href="https://unsplash.com/photos/aurora-borealis-on-night-sky-JKeIu3jjJFw" target="_blank" rel="noopener">Night</a>]</p>
  </footer>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <svg class="sketch-defs" aria-hidden="true" focusable="false">
    <filter id="sketch">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="1" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" />
    </filter>
  </svg>

  <script src="life-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
